<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chroniques — Suivi anti-spoil</title>
  <meta name="description" content="Wiki de suivi de Game of Thrones : résumés, personnages, carte et déplacements, débloqués épisode par épisode. Zéro spoiler.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0f14">
  <meta name="color-scheme" content="dark">

  <!-- Installation iOS : Partager > Ajouter à l'écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chroniques">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar" id="topbar">
    <button class="brand" id="brand" type="button" aria-label="Accueil">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26">
          <circle cx="16" cy="16" r="14" fill="none" stroke="#2c3542" stroke-width="3"/>
          <circle class="brand-ring" cx="16" cy="16" r="14" fill="none" stroke="#c8a15a"
                  stroke-width="3" stroke-linecap="round" stroke-dasharray="0 88"
                  transform="rotate(-90 16 16)"/>
          <path d="M16 8 L18.6 15 L16 24 L13.4 15 Z" fill="#c8a15a"/>
        </svg>
      </span>
      <span class="brand-text">Chroniques</span>
    </button>

    <button class="progress-chip" id="progressChip" type="button" aria-label="Progression">
      <span class="chip-code" id="chipCode">—</span>
      <span class="chip-sub" id="chipSub">Rien de visionné</span>
    </button>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Navigation principale">
    <a class="tab" href="#/reprise" data-tab="reprise">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 7.4 5M12 4v0m8-1v5h-5M12 8v4l3 2"/></svg>
      <span>Reprise</span>
    </a>
    <a class="tab" href="#/episodes" data-tab="episodes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5V3m8 2V3M3 10h18"/></svg>
      <span>Épisodes</span>
    </a>
    <a class="tab" href="#/carte" data-tab="carte">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2Zm0 0v16m6-14v16"/></svg>
      <span>Carte</span>
    </a>
    <a class="tab" href="#/personnages" data-tab="personnages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>Personnages</span>
    </a>
    <a class="tab" href="#/reglages" data-tab="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></svg>
      <span>Réglages</span>
    </a>
  </nav>

  <div class="sheet-host" id="sheetHost" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
